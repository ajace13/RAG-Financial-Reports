[project]
name = "finrag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over SEC 10-K/10-Q filings: hybrid BM25 + vector search, cross-encoder re-ranking, passage-level citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10,<3",
    "beautifulsoup4>=4.12",
    "elasticsearch>=9.5,<10",
    "lxml>=5.3",
    "numpy>=1.26",
    "openai>=3.55,<4",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sentence-transformers>=5.0",
    "streamlit>=1.60,<2",
    "torch>=2.9,<2.15",
]

# PyTorch: CUDA 13.0 wheels on Windows (local GPU dev box), CPU wheels elsewhere (CI).
# Linux/CUDA users can point the second entry at a CUDA index instead.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Elasticsearch instance"]
addopts = "-m 'not integration'"
