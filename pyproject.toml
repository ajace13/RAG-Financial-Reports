[project]
name = "finrag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over SEC 10-K/10-Q filings: hybrid BM25 + vector search, cross-encoder re-ranking, passage-level citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.5,<10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Elasticsearch instance"]
addopts = "-m 'not integration'"
